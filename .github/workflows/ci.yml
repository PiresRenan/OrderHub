name: CI

on:
  pull_request:
    branches:
      - main
      - pre-release
  push:
    branches:
      - main
      - pre-release

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ci-build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Full history is required because pull request hygiene checks compare
      # the proposed integration state against the exact base commit.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Pinned to actions/setup-java v6.0.0.
      - name: Configure Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify pull request whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA"...HEAD

      - name: Verify Maven Wrapper files
        run: |
          test -f mvnw
          test -f .mvn/wrapper/maven-wrapper.properties

      - name: Run complete verification
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress clean verify