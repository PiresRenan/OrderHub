# Resource-efficient Kubernetes profile for normal OrderHub development.
#
# This profile intentionally uses a single kind node. A separate scale profile
# will introduce workers when failure-domain and scheduling behavior become the
# subject under test.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: orderhub-dev

networking:
  ipFamily: ipv4

  # The Kubernetes API must remain reachable only from this workstation.
  apiServerAddress: "127.0.0.1"

nodes:
  - role: control-plane

    # Kubernetes and the node image are both pinned to the exact release
    # validated for OH-006 rather than following a mutable tag.
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5