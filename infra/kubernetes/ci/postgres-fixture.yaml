apiVersion: v1
kind: Service
metadata:
  name: orderhub-postgres-fixture
  labels:
    app.kubernetes.io/name: orderhub-postgres-fixture
    app.kubernetes.io/component: database-fixture
    app.kubernetes.io/part-of: orderhub-platform-validation

spec:
  selector:
    app.kubernetes.io/name: orderhub-postgres-fixture
    app.kubernetes.io/component: database-fixture

  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderhub-postgres-fixture
  labels:
    app.kubernetes.io/name: orderhub-postgres-fixture
    app.kubernetes.io/component: database-fixture
    app.kubernetes.io/part-of: orderhub-platform-validation

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: orderhub-postgres-fixture
      app.kubernetes.io/component: database-fixture

  template:
    metadata:
      labels:
        app.kubernetes.io/name: orderhub-postgres-fixture
        app.kubernetes.io/component: database-fixture
        app.kubernetes.io/part-of: orderhub-platform-validation

    spec:
      # This fixture has no reason to access the Kubernetes API.
      automountServiceAccountToken: false

      # The PostgreSQL process in the pinned image runs as the postgres user.
      # Explicit IDs keep the fixture admissible under the Restricted Pod
      # Security Standard enforced by the validation namespaces.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      terminationGracePeriodSeconds: 10

      containers:
        - name: postgres
          # CI uses the same immutable PostgreSQL image family accepted by
          # ADR-0005 and the persistence integration tests.
          image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
          imagePullPolicy: IfNotPresent

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: orderhub-database
                  key: database
                  optional: false

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: orderhub-database
                  key: username
                  optional: false

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orderhub-database
                  key: password
                  optional: false

          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP

          # Deployment availability means PostgreSQL is actually accepting
          # connections rather than merely having a running container process.
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - >-
                  pg_isready
                  --username="$POSTGRES_USER"
                  --dbname="$POSTGRES_DB"
            periodSeconds: 1
            timeoutSeconds: 2
            failureThreshold: 30
            successThreshold: 1

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          # This is a validation fixture, not a capacity recommendation for a
          # production PostgreSQL deployment.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

          volumeMounts:
            # PostgreSQL 18 stores its version-specific data hierarchy below
            # /var/lib/postgresql. The emptyDir makes fixture state explicitly
            # disposable with the validation cluster.
            - name: postgres-data
              mountPath: /var/lib/postgresql

      volumes:
        - name: postgres-data
          emptyDir:
            sizeLimit: 512Mi