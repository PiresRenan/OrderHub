apiVersion: v1
kind: Service
metadata:
  name: orderhub
  labels:
    app.kubernetes.io/name: orderhub
    app.kubernetes.io/part-of: orderhub
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: orderhub
    app.kubernetes.io/component: api

  # The only BFF-facing transport is HTTPS (ADR-0023). Consumers address
  # https://orderhub.<namespace>.svc:8443 and validate the certificate SAN.
  ports:
    - name: https
      port: 8443
      targetPort: https
      protocol: TCP