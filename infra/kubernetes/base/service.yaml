apiVersion: v1
kind: Service
metadata:
  name: orderhub
  labels:
    app.kubernetes.io/name: orderhub
    app.kubernetes.io/part-of: orderhub
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: orderhub
    app.kubernetes.io/component: api

  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP