apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderhub
  labels:
    app.kubernetes.io/name: orderhub
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: orderhub

spec:
  # Two replicas establish the first horizontal application baseline.
  replicas: 2

  # A newly-ready replica must remain ready briefly before Kubernetes counts it
  # as available during rollout progression.
  minReadySeconds: 3
  progressDeadlineSeconds: 120
  revisionHistoryLimit: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Do not intentionally reduce serving capacity during normal rollouts.
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: orderhub
      app.kubernetes.io/component: api

  template:
    metadata:
      labels:
        app.kubernetes.io/name: orderhub
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: orderhub
    spec:
      # OrderHub does not currently call the Kubernetes API.
      automountServiceAccountToken: false

      # Spring receives up to 25 seconds for its shutdown phase, leaving a
      # five-second margin before Kubernetes may force termination.
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001

        # Gives the non-root process access to explicitly mounted writable
        # volumes without weakening ownership of the immutable image.
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch

        seccompProfile:
          type:
            RuntimeDefault

      # Replicas should be distributed across distinct nodes whenever multiple
      # eligible node domains exist. On a single-node development cluster this
      # constraint remains satisfiable without inventing additional capacity.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: orderhub
              app.kubernetes.io/component: api

      containers:
        - name: orderhub
          image: orderhub:oh-006
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: orderhub-runtime-config

            # JWT trust configuration belongs to the deployment environment.
            # The reusable base declares the dependency but owns no issuer/JWK values.
            - configMapRef:
                name: orderhub-security
                optional: false

          # Database connectivity is supplied by the deployment environment.
          # The application manifests declare this contract but do not own or
          # commit concrete database endpoints or credentials.
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: orderhub-database
                  key: url
                  optional: false

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: orderhub-database
                  key: username
                  optional: false

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orderhub-database
                  key: password
                  optional: false

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # These values are provisional safety boundaries, not measured
          # capacity claims. OH-006 validates behavior; later load testing
          # calibrates the actual resource envelope.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # Startup gates the other probes, preventing normal JVM bootstrap from
          # being mistaken for either liveness or readiness failure.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30

          # Readiness controls whether this replica may receive Service traffic.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1

          # Liveness is deliberately independent from external dependencies and
          # should restart only a process that can no longer make progress.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
