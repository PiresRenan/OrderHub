# Rejects undeclared JSON fields instead of silently ignoring client typos
# or accidental contract drift.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Rejects floating-point numbers for integral Java contract fields instead of
# silently truncating values such as 2.75 into 2.
spring.jackson.deserialization.accept-float-as-int=false

# Rejects repeated JSON object property names because duplicate fields create
# ambiguous interpretation between parsers and downstream consumers.
spring.jackson.read.strict-duplicate-detection=true

# Uses RFC 9457 Problem Details for supported Spring MVC error responses.
spring.mvc.problemdetails.enabled=true

# Caps the JSON document processed by Jackson at 1 MiB. This is a technical
# safety boundary, not a business payload-size guarantee.
spring.jackson.factory.constraints.read.max-document-length=1048576

# Prevents excessively deep object/array structures from consuming parser
# stack and CPU disproportionately.
spring.jackson.factory.constraints.read.max-nesting-depth=64

# Prevents syntactically small structures from generating an unbounded number
# of parser tokens.
spring.jackson.factory.constraints.read.max-token-count=100000

# Technical Orders adapter limit. This does not define the commercial maximum
# number of lines allowed in an order and must be calibrated with evidence.
orderhub.orders.http.max-items=1000

# Exposes only the operational health endpoint over HTTP. Additional actuator
# capabilities must be explicitly reviewed before becoming remotely accessible.
management.endpoints.web.exposure.include=health

# Keeps health responses intentionally minimal so infrastructure endpoints do
# not disclose internal component topology or dependency details.
management.endpoint.health.show-details=never

# Enables Spring Boot application-availability health groups used by
# orchestrators for lifecycle decisions.
management.endpoint.health.probes.enabled=true

# Treats PostgreSQL as a required dependency for traffic eligibility. A running
# process without durable Order persistence must be removed from service rather
# than continue accepting requests it cannot reliably complete.
management.endpoint.health.group.readiness.include=readinessState,db

# Exposes liveness and readiness on the same HTTP server used by application
# traffic, preventing a separate management server from appearing healthy while
# the main application connector is unavailable.
management.endpoint.health.probes.add-additional-paths=true

# Gives active requests a bounded opportunity to complete after SIGTERM.
# Kubernetes will later use a slightly larger termination grace period so the
# JVM has time to finish this lifecycle phase before SIGKILL becomes necessary.
spring.lifecycle.timeout-per-shutdown-phase=25s

# Keeps expected database-readiness failures from dumping JDBC exception chains
# and infrastructure details. The health status itself remains DOWN and is still
# exposed through the readiness contract.
logging.level.org.springframework.boot.jdbc.health.DataSourceHealthIndicator=ERROR

# Prevents Hikari's connection-validation warning from exposing concrete JDBC
# connection implementation details during a database outage while preserving
# higher-severity pool failures.
logging.level.com.zaxxer.hikari.pool.PoolBase=ERROR

# Prevents normal Hikari startup logs from exposing the concrete JDBC
# connection implementation while retaining datasource lifecycle information.
logging.level.com.zaxxer.hikari.pool.HikariPool=WARN

# Prevents Flyway startup discovery from logging the complete JDBC connection
# URL. Migration validation and execution logs remain available through their
# narrower command-specific loggers.
logging.level.org.flywaydb.core.FlywayExecutor=WARN

# Prevents Hikari's broken-connection cleanup path from logging concrete JDBC
# implementation types and database exception stack traces during an outage.
logging.level.com.zaxxer.hikari.pool.ProxyConnection=ERROR

# Bounds create-Order transactions, including PostgreSQL row-lock waits.
# The 5-second value is an OH-011 provisional safety baseline, not a
# load-derived latency SLA or proven capacity limit.
orderhub.orders.transaction.timeout=5s

# Provisional OH-011 Category hierarchy lock-wait safety boundary; not an SLA.
orderhub.catalog.category-hierarchy.transaction.timeout=5s
# Bounds only PostgreSQL lock waiting performed while arbitrating one durable
# create-Order idempotency identity. This provisional 500 ms safety boundary is
# intentionally shorter than the total Order transaction timeout and is not a
# load-derived latency SLA.
orderhub.orders.idempotency.acquisition-timeout=500ms
