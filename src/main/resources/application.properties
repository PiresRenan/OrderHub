# Rejects undeclared JSON fields instead of silently ignoring client typos
# or accidental contract drift.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Rejects floating-point numbers for integral Java contract fields instead of
# silently truncating values such as 2.75 into 2.
spring.jackson.deserialization.accept-float-as-int=false

# Rejects repeated JSON object property names because duplicate fields create
# ambiguous interpretation between parsers and downstream consumers.
spring.jackson.read.strict-duplicate-detection=true

# Uses RFC 9457 Problem Details for supported Spring MVC error responses.
spring.mvc.problemdetails.enabled=true

# Caps the JSON document processed by Jackson at 1 MiB. This is a technical
# safety boundary, not a business payload-size guarantee.
spring.jackson.factory.constraints.read.max-document-length=1048576

# Prevents excessively deep object/array structures from consuming parser
# stack and CPU disproportionately.
spring.jackson.factory.constraints.read.max-nesting-depth=64

# Prevents syntactically small structures from generating an unbounded number
# of parser tokens.
spring.jackson.factory.constraints.read.max-token-count=100000

# Technical Orders adapter limit. This does not define the commercial maximum
# number of lines allowed in an order and must be calibrated with evidence.
orderhub.orders.http.max-items=1000