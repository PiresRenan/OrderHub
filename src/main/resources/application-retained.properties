# Retained transport boundary (OH-027, ADR-0023).
#
# Activated only by the retained Kubernetes Deployment. The embedded Tomcat
# listener terminates TLS itself with deployment-owned PEM material mounted
# read-only from the orderhub-tls Secret. There is no plaintext listener and no
# fallback: missing or unreadable material rejects startup.
server.port=8443
server.ssl.bundle=orderhub-server

# Passwordless PEM leaf certificate (optionally followed by intermediates) and
# PKCS#8/PKCS#1 private key. The paths are the fixed container mount contract.
spring.ssl.bundle.pem.orderhub-server.keystore.certificate=file:/etc/orderhub/tls/tls.crt
spring.ssl.bundle.pem.orderhub-server.keystore.private-key=file:/etc/orderhub/tls/tls.key

# Certificate hot reload is deliberately not enabled. Rotation is an explicit
# Secret update followed by a rolling restart that the readiness gates observe.
